log_format routing '$time_iso8601 $request_method $status $request_time';
limit_req_zone $binary_remote_addr zone=routing:10m rate=5r/s;
server {
 listen 8080;
 access_log /var/log/nginx/access.log routing;
 location /route/v1/driving/ {
  if ($http_authorization != "Bearer ${OSRM_TOKEN}") { return 403; }
  limit_req zone=routing burst=10 nodelay;
  proxy_pass http://osrm:5000;
  proxy_read_timeout 15s;
  proxy_set_header Authorization "";
 }
 location / { return 404; }
}
